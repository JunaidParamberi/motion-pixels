<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Card placeholder">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c0c"/>
      <stop offset="55%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#cg)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  <text x="50%" y="48%" fill="rgba(255,255,255,0.12)" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="600" text-anchor="middle">Card image</text>
  <text x="50%" y="54%" fill="rgba(255,255,255,0.08)" font-family="system-ui,Segoe UI,sans-serif" font-size="13" text-anchor="middle">Replace in /images/projects/&lt;slug&gt;/</text>
</svg>
